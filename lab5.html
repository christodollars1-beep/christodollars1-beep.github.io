<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeStart - Student Registration</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">CodeStart</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#home">Home</a>
                <a class="nav-link" href="#register">Register</a>
            </div>
        </div>
    </nav>

    <!-- Welcome Section -->
    <section id="home" class="hero text-center text-white py-5">
        <div class="container">
            <h1 class="display-4 fw-bold">
                Start Your Coding Journey!
            </h1>

            <p class="lead">
                Learn programming and build your future with us.
            </p>

            <a href="#register" class="btn btn-light btn-lg mt-3">
                Join Our Program
            </a>
        </div>
    </section>

    <!-- Registration Form -->
    <section id="register" class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">

                <div class="card shadow border-0">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-2">
                            Student Registration
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Fill in the form below to get started.
                        </p>

                        <form id="registrationForm">

                            <div class="mb-3">
                                <label for="fullName"
                                       class="form-label">
                                    Full Name
                                </label>

                                <input type="text"
                                       class="form-control"
                                       id="fullName"
                                       placeholder="Enter your full name"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="email"
                                       class="form-label">
                                    Email Address
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="course"
                                       class="form-label">
                                    Choose a Course
                                </label>

                                <select class="form-select"
                                        id="course"
                                        required>
                                    <option value="">Select a course</option>
                                    <option value="HTML and CSS">
                                        HTML and CSS
                                    </option>
                                    <option value="JavaScript">
                                        JavaScript
                                    </option>
                                    <option value="C++">
                                        C++
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="message"
                                       class="form-label">
                                    Why do you want to learn coding?
                                </label>

                                <textarea class="form-control"
                                          id="message"
                                          rows="3"
                                          placeholder="Write a short message"></textarea>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Register Now
                            </button>

                            <p id="result"
                               class="text-success text-center mt-3 mb-0"
                               role="status"
                               aria-live="polite"></p>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            &copy; 2026 CodeStart. All rights reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script>
        const form = document.getElementById("registrationForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("fullName").value;
            const course = document.getElementById("course").value;

            result.textContent =
                "Thank you, " + name +
                "! You registered for " + course + ".";

            form.reset();
        });
    </script>

</body>
</html>
